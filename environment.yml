name: sticky
channels: [conda-forge, defaults]
dependencies:
  - python=3.10
  - pip>=23.3
  - numpy=1.26.*
  - hydra-core=1.3.2
  - omegaconf=2.3.0
  - pyyaml
  - pip:
      # Use the CUDA12 plugin packaging to vendor CUDA user-space libs
      # (cuDNN/cuPTI/etc.) inside the environment.
      - jax==0.4.38
      - jaxlib==0.4.38
      - jax-cuda12-plugin[with-cuda]==0.4.38
      - flax==0.8.3
      - optax==0.2.4
      - numpyro==0.15.0
      - hydra-joblib-launcher==1.2.0
      - hydra-submitit-launcher==1.2.0
      - wandb>=0.16.4
      - matplotlib==3.8.4
      - tensorflow==2.16.1
      - tensorflow-probability==0.24.0
      - tf-keras==2.16.0
      - tensorflow-datasets==4.9.*
      - etils[epath]>=1.5.1
      - clu 
      - distrax 
      - seaborn
