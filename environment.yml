name: sticky
channels: [conda-forge, defaults]
dependencies:
  - python=3.10
  - pip>=23.3
  - numpy=1.26.*
  - hydra-core=1.3.2
  - omegaconf=2.3.0
  - pyyaml
  - pip:
      # Install JAX with bundled CUDA12 userspace deps (cuDNN/cuPTI/NVCC/PTXAS).
      - jax[cuda12]==0.4.38
      # flax 0.8.x is incompatible with jax 0.4.38 (EvalTrace.level error).
      - flax==0.10.2
      - optax==0.2.4
      - numpyro==0.15.0
      - hydra-joblib-launcher==1.2.0
      - hydra-submitit-launcher==1.2.0
      - wandb>=0.16.4
      - matplotlib==3.8.4
      # Keep TensorFlow stack compatible with jax>=0.4.38 (ml_dtypes>=0.4).
      - tensorflow==2.18.0
      - tensorflow-probability==0.25.0
      - tf-keras==2.18.0
      - tensorflow-datasets==4.9.*
      - etils[epath]>=1.5.1
      - clu
      - distrax
      - seaborn
      - tqdm>=4.66
      # Data prep: HuggingFace OpenWebText + GPT-2 tokenizer.
      - datasets>=2.18
      - transformers>=4.40
      # Dev / test.
      - pytest>=7.0
