# End-to-end SJD ELBO at eta=1 (appendix `alg:sjd-e2e-eta1`). Learns the
# per-anchor hazard w(a) jointly with the classifier under L_CE + L_RB + Omega.
#
# This is the only learnable-w mode. It draws Y ~ q_t directly and puts the
# (1 - S_a) factor into a deterministic weight, so every w-dependence is
# closed-form and reparametrized (unbiased gradient on log_w).
#
# Requires:
#   jump.eta == 1.0  (any other eta is rejected at task construction).
#   blur_kernel == null (W = I, the only path with the eta=1 closed-form lam_hat).
mode: learned_e2e
enabled: true
# zeros: start from w(a) ≡ 1 (anchor-agnostic baseline at step 0).
# frequency: initialize from an npz precomputed by tools/compute_anchor_frequencies.py.
init: zeros
log_w_path: null
# loss_weighting is set by the objective; this field has no effect when mode=learned_e2e.
loss_weighting: null
# rb_weight: scale on the rate-balance term L_RB. Set to 0.0 to disable
# (training only on CE + prior).
rb_weight: 1.0
# rb_share_sample: if true, reuse the CE forward pass for L_RB (1x cost,
# correlated CE/RB gradients). If false, draw an independent sample for L_RB
# (2x cost, cleaner gradient decomposition). Default true for exploration;
# flip to false for quality-sensitive final runs.
rb_share_sample: true
# score_w_stop_gradient: gates whether L_score's (1-S_a) occupancy factor
# is differentiable w.r.t. log_w. Three conditions for the SJD World-1-vs-
# World-2 hazard-learning test (see plan):
#   - false (default): the v3 full ELBO. L_score's w-gradient flows via
#     (1-S_a); theta still fit by CE only via the residual stop_gradient.
#     This is the ELBO condition.
#   - true: L_score is fully stop-gradiented. It contributes zero gradient
#     to both theta AND log_w (still computed and logged). This is the CE
#     condition that isolates the discrete-channel-preferred schedule.
# (For the FIXED condition, use hazard_weighting=none; no log_w is learned
# and this flag is irrelevant.)
score_w_stop_gradient: false
# prior_strength: lambda_Omega for Omega(w) = lambda_Omega * Sum_a (w(a) - 1)^2.
# WEAK default (0.01) because the hazard is likelihood-unidentified at the
# optimum: a heavy prior pins log_w = 0 even when data wants something else
# (a spurious null). The clamp below is the load-bearing safety bound; the
# prior just nudges back toward the anchor-agnostic baseline.
prior_strength: 0.01
# smoothing_alpha and normalize_mean mirror the precompute-script flags;
# not consumed at runtime.
smoothing_alpha: 1.0
normalize_mean: true
# clip: per-element clamp on log_w(a) (in LOG SPACE), applied inside
# TokenAnchors.log_w_float() after mean-recentering. [-3, 3] => w in
# [~0.05, 20]. Bounds w against float32 overflow in (w-1)^2 and against
# underflow in exp(-w * B(t)). Loose by design — see corrected appendix
# rem:hazard-flat on likelihood-unidentifiability of the hazard.
clip: [-3.0, 3.0]
