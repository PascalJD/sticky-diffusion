# Paper-style CIFAR-10 experiment bundle for the continuous DDPM baseline.

defaults:
  - /dataset: cifar10_discrete
  - /model: ddpm_cifar10
  - /optim: adamw_ddpm
  - /training: ddpm_cifar10_paper
  - /runtime: default
  - _self_

task:
  name: ddpm_cifar10_paper

dataset:
  batch_size: 512
  eval_batch_size: 512
  augment:
    enabled: true
    prob: 0.15
    rotate: true
    hflip: true
