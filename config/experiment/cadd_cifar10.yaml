# Paper-aligned CIFAR-10 experiment config for CADD.
#
# The paper is ambiguous between the main-text Gaussian latent and
# the Appendix flow-matching latent. This profile defaults to the
# Appendix-style flow-matching latent as the reproduction target, while keeping
# the Gaussian latent available as an explicit override.
defaults:
  - /dataset: cifar10_discrete
  - /model: cadd_cifar10
  - /optim: adamw_cadd
  - /training: cadd_cifar10
  - /runtime: default
  - _self_

task:
  name: cadd_cifar10
