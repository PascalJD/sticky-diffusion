# CADD CIFAR-10 experiment config.
defaults:
  - /dataset: cifar10_discrete
  - /model: cadd_cifar10
  - /optim: adamw
  - /training: cadd_cifar10
  - /runtime: default
  - _self_
  - override /eval: cadd_cifar10

task:
  name: cadd_cifar10

# Enable pixel-preserving augmentations on CIFAR-10 (Karras et al. style),
# keeping only rotation+flip as described in the CADD paper.
dataset:
  augment:
    enabled: true
