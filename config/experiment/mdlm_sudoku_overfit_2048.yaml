# Tiny overfit bring-up on 2048 Sudoku examples.
defaults:
  - mdlm_sudoku_tfw_top_prob_margin
  - _self_

dataset:
  batch_size: 128
  eval_batch_size: 128
  max_train_examples: 2048
  max_test_examples: 2048

training:
  num_train_epochs: 100
  eval_every_steps: 100
  checkpoint_every_steps: 100
  log_every_steps: 20
