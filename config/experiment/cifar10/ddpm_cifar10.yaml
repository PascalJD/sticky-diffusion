# Canonical CIFAR-10 experiment bundle for the continuous DDPM baseline.

defaults:
  - /dataset: cifar10_discrete
  - /model/baseline@model: ddpm_cifar10
  - /optim: adamw_cifar10
  - /sampler/cifar10@sampler: ddpm_cifar10
  - /training: cifar10
  - /runtime: default
  - /eval@_global_.eval: cifar10
  - _self_

task:
  name: ddpm_cifar10
