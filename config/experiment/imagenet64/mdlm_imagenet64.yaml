# MDLM experiment bundle for ImageNet 64x64.
defaults:
  - /dataset: imagenet64_discrete
  - /model/baseline@model: mdlm_imagenet64
  - /optim: adamw_imagenet64
  - /sampler/cifar10@sampler: mdlm_cifar10
  - /training: imagenet64
  - /runtime: default
  - /eval@_global_.eval: imagenet64
  - _self_

task:
  name: mdlm_imagenet64

sampler:
  n_steps: 512

training:
  sample_timesteps: 512
