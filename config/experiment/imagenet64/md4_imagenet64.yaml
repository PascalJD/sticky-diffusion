# MD4 experiment bundle for downsampled ImageNet 64x64.

defaults:
  - /dataset: imagenet64_discrete
  - /model/baseline@model: md4_imagenet64
  - /optim: adamw_imagenet64
  - /sampler: md4_cifar10
  - /training: imagenet64
  - /runtime: default
  - _self_

task:
  name: md4_imagenet64

sampler:
  n_steps: 512

training:
  sample_timesteps: 512

# MD4 adds 8 DiT transformer layers over the UNet, which pushes peak
# activation memory above what SJD's plain ADM UNet needs. Halve the
# batch to fit on 2x H100 80GB.
dataset:
  batch_size: 32
  eval_batch_size: 32
