# MD4 experiment bundle for downsampled ImageNet 64x64.

defaults:
  - /dataset: imagenet64_discrete
  - /model/baseline@model: md4_imagenet64
  - /optim: adamw_imagenet64
  - /sampler/cifar10@sampler: md4_cifar10
  - /training: imagenet64
  - /runtime: default
  - /eval@_global_.eval: imagenet64
  - _self_

task:
  name: md4_imagenet64

sampler:
  n_steps: 512

training:
  sample_timesteps: 512
