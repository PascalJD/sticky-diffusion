# Phase-2 fine-tune: confidence-margin sitewise forward hazard.
# Resumes from a phase-1 uniform-forward checkpoint.
defaults:
  - /dataset: sudoku_shah_board
  - /model/sjd@model: sjd_sudoku_inpaint
  - /optim: adamw_sudoku_tfw
  - /sampler: sjd_sudoku
  - /training: sudoku_sjd
  - /forward/beta: vp_linear
  - /forward/hazard: poly_alpha
  - /forward/jump: vp_matched
  - /runtime: default
  - _self_

task:
  name: sjd_sudoku_inpaint

wandb:
  run_name: sjd_sudoku_finetune_teacher_margin

dataset:
  batch_size: 128
  eval_batch_size: 128

forward:
  jump:
    eta: 0.97

training:
  order_conditioning: none
  forward_site_hazard_mode: teacher_margin
  teacher_source: ema
  teacher_confidence_metric: margin
  teacher_w_min: 0.5
  teacher_w_max: 2.0
  teacher_neutral_weight: 1.0
  teacher_log_metrics: true
  init_from_checkpoint: ???
  init_load_ema: true
  init_reset_optimizer: true
  init_reset_step: true
  num_train_steps: 50000
