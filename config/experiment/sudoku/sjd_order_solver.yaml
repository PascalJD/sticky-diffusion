# Thermometer SJD Sudoku with solver-order-conditioned forward hazard.
# Per-cell survival S_i(t) = S(t)^{w_i} with w_i linear in the Shah solver rank.
# No antithetic, no alpha_deriv (baseline loss/time sampling).
defaults:
  - /dataset: sudoku_shah_board
  - /model/sjd@model: sjd_sudoku_inpaint
  - /optim: adamw_sudoku_tfw
  - /sampler: sjd_sudoku
  - /training: sudoku_sjd
  - /forward/beta: vp_linear
  - /forward/hazard: poly_alpha
  - /forward/jump: vp_matched
  - /runtime: default
  - _self_

task:
  name: sjd_sudoku_inpaint

wandb:
  run_name: sjd_order_solver

dataset:
  batch_size: 128
  eval_batch_size: 128

forward:
  jump:
    eta: 0.97

training:
  order_conditioning: solver
  order_w_min: 0.5
  order_w_max: 2.0
