# Config scaffolding for a TFW-faithful Ye-style Sudoku MDM path.
defaults:
  - /dataset: sudoku
  - /model/baseline@model: mdm_sudoku
  - /optim: adamw_sudoku_tfw
  - /sampler: mdm_sudoku_top_prob_margin
  - /training: sudoku_mdm_tfw
