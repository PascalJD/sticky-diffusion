# Legacy config scaffolding for the packed seq2seq TFW-faithful Ye-style Sudoku
# MDM path. New minimal Shah-board inpainting work should use
# `mdm_sudoku_inpaint_tfw_sanity` instead.
defaults:
  - /dataset: sudoku
  - /model/baseline@model: mdm_sudoku
  - /optim: adamw_sudoku_tfw
  - /sampler: mdm_sudoku_top_prob_margin
  - /training: sudoku_mdm_tfw
  - /runtime: default
  - _self_

task:
  name: mdm_sudoku

dataset:
  batch_size: 128
  eval_batch_size: 128
