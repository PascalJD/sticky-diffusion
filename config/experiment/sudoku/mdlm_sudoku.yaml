# Canonical board-level MDLM Sudoku experiment with eval-driven sampler comparison.
defaults:
  - /dataset: sudoku_shah_board
  - /model/baseline@model: mdlm_sudoku
  - /optim: adamw_sudoku_tfw
  - /sampler: mdlm_sudoku_top_prob_margin
  - /training: sudoku_mdlm
  - /runtime: default
  - _self_

task:
  name: mdlm_sudoku

dataset:
  batch_size: 128
  eval_batch_size: 128

sampler:
  categorical_sampling_policy: exact
  oracle_noise_type: gumbel
  oracle_noise_scale: 0.5
