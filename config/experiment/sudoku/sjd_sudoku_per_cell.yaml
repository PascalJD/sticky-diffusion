# Per-cell anchor variant of the canonical board-level SJD Sudoku experiment.
# Identical to sjd_sudoku.yaml except for the model preset, which uses 81
# learnable 9-anchor blocks (one per cell) instead of a single global block.
defaults:
  - /dataset: sudoku_shah_board
  - /model/sjd@model: sjd_sudoku_inpaint_per_cell
  - /optim: adamw_sudoku
  - /runtime: default
  - /forward/beta: vp_linear
  - /forward/hazard: poly_alpha
  - /forward/hazard_weighting: none
  - /forward/jump: vp_matched
  - /sampler/sudoku@sampler: sjd_sudoku
  - /eval@_global_.eval: sudoku_sjd
  - /training: sudoku_sjd
  - _self_

task:
  name: sjd_sudoku_inpaint

dataset:
  batch_size: 128
  eval_batch_size: 128

forward:
  jump:
    eta: 0.8
