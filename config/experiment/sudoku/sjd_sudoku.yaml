# Canonical Sudoku experiment bundle for SJD.
defaults:
  - /dataset: sudoku
  - /model/sjd@model: sjd_sudoku
  - /optim: adamw_sudoku
  - /training: sjd_sudoku
  - /runtime: default
  - /sampler: sjd_sudoku
  - /forward/beta: vp_linear
  - /forward/hazard: poly_alpha
