# Sudoku SJD with constraint-graph un-sticking kernel.
# Mirrors sjd_sudoku.yaml exactly with one extra default (/forward/blur:
# sudoku_constraint). Hydra does not support flat experiment-to-experiment
# inheritance via defaults, so the body and defaults below are duplicated
# from sjd_sudoku.yaml. KEEP IN SYNC: any change to the baseline (eta,
# hazard, optimizer, etc.) must be mirrored here so the only ablation delta
# remains the kernel.
defaults:
  - /dataset: sudoku_shah_board
  - /model/sjd@model: sjd_sudoku_inpaint
  - /optim: adamw_sudoku
  - /runtime: default
  - /forward/beta: vp_linear
  - /forward/hazard: poly_alpha
  - /forward/hazard_weighting: none
  - /forward/jump: vp_matched
  - /forward/blur: sudoku_constraint    # turn on the constraint kernel
  - /sampler/sudoku@sampler: sjd_sudoku
  - /eval@_global_.eval: sudoku_sjd
  - /training: sudoku_sjd
  - _self_

task:
  name: sjd_sudoku_inpaint

dataset:
  batch_size: 128
  eval_batch_size: 128

forward:
  jump:
    eta: 0.97

# Knobs to ablate via CLI: forward.blur.{sigma,include_row,include_col,include_box}
