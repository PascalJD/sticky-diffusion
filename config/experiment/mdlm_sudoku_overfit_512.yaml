# Tiny overfit bring-up on 512 Sudoku examples.
defaults:
  - mdlm_sudoku_tfw_top_prob_margin
  - _self_

dataset:
  batch_size: 64
  eval_batch_size: 64
  max_train_examples: 512
  max_test_examples: 512

training:
  num_train_epochs: 100
  eval_every_steps: 100
  checkpoint_every_steps: 100
  log_every_steps: 20
