# SJD experiment bundle aligned with CADD CIFAR settings.

defaults:
  # Core components.
  - /dataset: cifar10_discrete
  - /model: sjd_cifar10
  - /optim: adamw_cadd
  - /training: sjd_cifar10_cadd
  - /runtime: default

  # SJD-specific sampling and forward-process pieces.
  - /sampler: cadd_cifar10
  - /forward/beta: vp_linear
  - /forward/hazard: early
  - /forward/jump: vp_matched

  - _self_

task:
  name: sjd_cifar10

# CADD/ADM-style image backbone defaults for CIFAR-32.
model:
  image_backbone: adm_unet5d
  ch_mult: [1, 2, 2, 2]
  adm_num_res_blocks: 2
  adm_attention_resolutions: [2, 4]
  adm_num_heads: 4
  adm_num_head_channels: -1
  adm_num_heads_upsample: -1
  adm_conv_resample: true
  adm_use_scale_shift_norm: true
  adm_resblock_updown: false
  adm_use_conv_skip: false

# Use a larger global batch for this run profile.
dataset:
  batch_size: 256
  eval_batch_size: 256
