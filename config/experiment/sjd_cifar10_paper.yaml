# Paper-style SJD CIFAR-10 experiment bundle for ADM-vs-CADD comparison.

defaults:
  - /dataset: cifar10_discrete
  - /model: sjd_cifar10_paper
  - /optim: adamw_sjd_cifar10_paper
  - /training: sjd_cifar10_paper
  - /runtime: default
  - /sampler: sjd_cifar10_paper
  - /forward/beta: vp_linear
  - /forward/hazard: poly_alpha
  - /forward/jump: vp_matched
  - _self_

task:
  name: sjd_cifar10_paper

# Enable pixel-preserving augmentations on CIFAR-10 (Karras et al. style),
# keeping only rotation+flip for parity with the paper-style image recipe.
dataset:
  batch_size: 512
  eval_batch_size: 512
  augment:
    enabled: true
    prob: 0.15
    rotate: true
    hflip: true

forward:
  hazard:
    p: 3.0
