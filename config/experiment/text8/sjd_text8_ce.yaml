# Text8 SJD with end-to-end LEARNABLE hazard, trained on the CE+RB SUBSET of
# the ELBO (L_score fully stop-gradiented). The CE condition of the
# hazard-learning ablation.
#
# SINGLE DIFF from sjd_text8_elbo.yaml: hazard_weighting.score_w_stop_gradient
# = true. L_score's value is still computed/logged (loss/score) but contributes
# ZERO gradient to theta or log_w, isolating the discrete-channel-preferred
# schedule from the score term's ELBO opposition. Everything else (forward
# stack, model with learnable anchors, optimizer, sampler, eval, log_w clamp,
# prior_strength, log_w_lr_multiplier) is identical to the ELBO condition.
#
# Cross-condition map (only these differ):
#   sjd_text8_fixed.yaml : hazard_weighting=none                         (FIXED, w=1, CE)
#   sjd_text8_elbo.yaml  : learned_e2e + score_w_stop_gradient=false     (ELBO)
#   sjd_text8_ce.yaml    : learned_e2e + score_w_stop_gradient=true      (CE)
defaults:
  - /dataset: text8_char_128
  - /model/sjd@model: sjd_text8
  - /optim: adamw_text8
  - /runtime: default
  - /forward/beta: vp_linear
  - /forward/hazard: poly_alpha              # linear survival S(t)=1-t
  - /forward/hazard_weighting: learned_e2e   # ELBO at eta=1, learnable log_w
  - /forward/jump: vp_matched                # eta=1.0 (VP-matched)
  - /forward/blur: none                       # W = I, required by elbo_eta1
  - /sampler/text8@sampler: sjd_text8
  - /eval@_global_.eval: text8
  - /training: sjd_text8
  - _self_

forward:
  hazard:
    p: 1.0                                    # pin linear survival explicitly (as FIXED)
  hazard_weighting:
    score_w_stop_gradient: true               # CE: stop-gradient the whole L_score residual
    prior_strength: 0.0                       # Layer-A: no Omega prior (clamp is the safety bound)
    clip: [-3.0, 3.0]                         # Layer-A: per-element log_w clamp (w in ~[0.05, 20])

training:
  log_w_lr_multiplier: 0.1                    # ~lr/10 for the hazard parameter group

task:
  name: text8_sjd

wandb:
  run_name: sjd_text8_ce
