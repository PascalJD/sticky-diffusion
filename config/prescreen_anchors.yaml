defaults:
  - experiment: sjd_anchor_study_cifar10
  - prescreen/candidates: study_core
  - hydra: default
  - _self_

prescreen:
  base_experiment: sjd_anchor_study_cifar10
  base_eval: sjd_anchor_study_cifar10
  output_dir: prescreen_anchors
  target_identifiability: 1.0
  ident_quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]
  time_grid:
    t_min: 1.0e-4
    t_max: ${experiment.sampler.T}
    num_points: 129
  reference_time:
    mode: alpha_eq_sigma
    manual_t: 0.5
  plots:
    enabled: false
    dir: plots
  manifest:
    write_slurm_snippets: true
