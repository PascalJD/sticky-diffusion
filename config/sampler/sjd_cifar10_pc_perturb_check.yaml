# SJD CIFAR-10 sampler with perturb-check corrector gate.
defaults:
  - sjd_cifar10
  - _self_

pc_enabled: true
corrector_substeps: 1
corrector_step_scale: 0.5
pc_gate: perturb_check

# Reopen proposal kernel: eta_reopen = 0.25 * eta_main.
pc_eta_reopen: 0.2
# Only apply corrector when normalised time tau = t/T is in this window.
pc_remask_window_lo: 0.15
pc_remask_window_hi: 0.85
# Cap reopens per site across the full trajectory.
pc_max_reopens_per_site: 1
