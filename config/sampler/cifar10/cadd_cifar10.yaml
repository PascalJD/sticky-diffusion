defaults:
  - /sampler/base@_here_
  - _self_

# CADD decode policy.
sampling_grid: cosine
temperature_schedule: cosine_decay
tau_max: 2.5
logit_temperature: 1.0

z0_estimator: hard
# Appendix C.3 shows most of the multi-sample gain by K=3.
K: 3
force_decode_at_end: true

# See Gat et al. 2024
remask_refine_enabled: true
remask_refine_steps: 1
remask_refine_frac: 0.1
remask_refine_metric: entropy
remask_refine_sample_mode: sample
