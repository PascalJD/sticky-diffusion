# Sampler profile for SJD Text8. CANDI default: 128 denoising steps,
# temperature 1.0, nucleus 1.0 (no truncation).
T: ${oc.select:forward.beta.T, 1.0}
n_steps: 128
sampling_grid: cosine

alloc_mode: sample
score_from_classifier: true
score_scale: 1.0
logit_temperature: 1.0

categorical_sampling_policy: legacy_low

hazard_mode: plugin
log_ratio_clip: 10.0
refresh_logits_after_em_step: true

init_std: 1.0
eps_denom: 1e-12
rng_fold: 4

force_classify_at_end: true

metrics_count_nfe: true
