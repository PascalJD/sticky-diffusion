# Sampler profile for SJD Text8. CANDI default: 128 denoising steps,
# temperature 1.0, nucleus 1.0 (no truncation).
T: ${oc.select:forward.beta.T, 1.0}
n_steps: 128
sampling_grid: cosine

alloc_mode: sample
score_from_classifier: true
score_scale: 1.0
logit_temperature: 1.0

categorical_sampling_policy: legacy_low

hazard_mode: plugin
log_ratio_clip: 10.0
refresh_logits_after_em_step: true

init_std: 1.0
eps_denom: 1e-12
rng_fold: 4

force_classify_at_end: true

metrics_count_nfe: true

# Sanctioned sampling-strategy options, DEFAULT OFF = current/CANDI-baseline
# behavior (bit-identical when off and at temperature 1.0). See SamplerConfig.
# symmetric_temperature: apply logit_temperature to the continuous-drift
#   posterior too (not only the discrete-jump allocation).
# ancestral_final_commit: draw the forced final commit from the untempered
#   allocation (removes the low-temp near-argmax lock-in).
symmetric_temperature: false
ancestral_final_commit: false
