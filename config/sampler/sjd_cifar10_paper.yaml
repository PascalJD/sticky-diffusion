# Sampler profile for paper-style SJD CIFAR-10.
# Time discretization.
# Use 256 SJD steps and refresh logits after each EM step to keep total NFE at 512.
T: ${oc.select:forward.beta.T, 1.0}
n_steps: 256
sampling_grid: cosine

# Score + anchor-allocation mode.
alloc_mode: sample
score_from_classifier: true
score_scale: 1.0
# Jump-allocation temperature only; reverse score uses raw classifier logits.
logit_temperature: 1.0

# Plug-in hazard/intensity controls.
hazard_mode: plugin
intensity_mode: full
log_ratio_clip: 10.0
intensity_chunk_size: 256
refresh_logits_after_em_step: true

# Numerical/stochastic controls.
init_std: 1.0
eps_denom: 1e-12
rng_fold: 4

# Terminal cleanup behavior (force terminal plug-in jump at t=dt).
force_classify_at_end: true
