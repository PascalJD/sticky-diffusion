# Sampler profile for Sudoku SJD.
T: ${oc.select:forward.beta.T, 1.0}
n_steps: 50
sampling_grid: uniform

alloc_mode: sample
score_from_classifier: true
score_scale: 1.0
logit_temperature: 0.8
categorical_sampling_policy: legacy_low

hazard_mode: plugin
intensity_mode: full
log_ratio_clip: 10.0
intensity_chunk_size: 256

init_std: 1.0
eps_denom: 1e-12
rng_fold: 4

force_classify_at_end: true
refresh_logits_after_em_step: false
