# Sampler profile for Sudoku SJD.
# TrainForWorst uses 50 reverse steps for Sudoku inference.
T: ${oc.select:forward.beta.T, 1.0}
n_steps: 50
sampling_grid: uniform

# Score + anchor-allocation mode.
alloc_mode: sample
score_from_classifier: true
score_scale: 1.0

# Jump-allocation temperature only; reverse score uses raw classifier logits.
logit_temperature: 0.8

# Plug-in hazard/intensity controls.
hazard_mode: plugin
intensity_mode: full
log_ratio_clip: 10.0
# Deprecated compatibility field; ignored while only the full backend is active.
intensity_chunk_size: 256
refresh_logits_after_em_step: false

# Numerical/stochastic controls.
init_std: 1.0
eps_denom: 1e-12
rng_fold: 4

# Terminal cleanup behavior (legacy key name: force terminal plug-in jump).
force_classify_at_end: true
