# Sampler profile for Sudoku SJD.
# TrainForWorst uses 50 reverse steps for Sudoku inference.
T: ${oc.select:forward.beta.T, 1.0}
n_steps: 50

# Score + anchor-allocation mode.
alloc_mode: sample
score_from_classifier: true
score_scale: 1.0

# Slightly higher decoding temperature for Sudoku SJD stability.
logit_temperature: 0.8

# Plug-in hazard/intensity controls.
hazard_mode: plugin
intensity_mode: chunked
log_ratio_clip: 10.0
intensity_chunk_size: 256

# Numerical/stochastic controls.
init_std: 1.0
eps_denom: 1e-12
rng_fold: 4

# Output behavior.
force_classify_at_end: true
