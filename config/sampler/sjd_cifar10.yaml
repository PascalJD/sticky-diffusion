# Sampler profile for SJD CIFAR-10
T: ${oc.select:forward.beta.T, 1.0}
n_steps: 256 # NFE = 2*n_steps if refresh_logits_after_em_step is true
sampling_grid: cosine  # uniform or cosine-warped

alloc_mode: sample
score_from_classifier: true
score_scale: 1.0
# Jump-allocation temperature only; reverse score uses raw classifier logits.
logit_temperature: 1.0

# Keep the MD4 Appendix G / better-sample-quality default; see
# sampler/base.yaml for the full tradeoff summary of the available policies.
categorical_sampling_policy: legacy_low

# Plug-in hazard/intensity controls.
hazard_mode: plugin
intensity_mode: full
log_ratio_clip: 10.0
refresh_logits_after_em_step: true

# Numerical/stochastic controls.
init_std: 1.0
eps_denom: 1e-12
rng_fold: 4

# Force terminal plug-in jump at t=dt
force_classify_at_end: true

pc_enabled: false
corrector_substeps: 0
corrector_step_scale: 0.0
pc_gate: constant_one
pc_clamp_known: true
pc_refresh_logits_after_langevin: false
pc_allow_unstick_unknown_only: true
metrics_count_nfe: true
