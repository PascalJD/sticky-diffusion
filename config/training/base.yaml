# Shared CIFAR-10 training defaults.
seed: 0

num_train_steps: 400000
ema_rate: 0.9999

log_every_steps: 500
timing_warn_seconds: 30
eval_every_steps: 0
checkpoint_every_steps: 10000
log_images_every_steps: 10000
num_log_images: 16

checkpoint_dir: checkpoints
checkpoint_keep: 3
save_final_checkpoint: true
best_checkpoint_metric: eval/fid
best_checkpoint_mode: min
best_update_on_equal: false

metrics_dir: metrics
metrics_every_steps: 1000
save_final_metrics: true

sample_timesteps: ${..sampler.n_steps}

# Unified SJD forward-site hazard switch:
#   "none"           — scalar survival S(t) applied uniformly across sites.
#   "solver"         — sitewise S(t)^{w_i} from provided solver_rank (legacy solver-order).
#   "teacher_margin" — sitewise S(t)^{w_i} from a detached EMA teacher's confidence.
forward_site_hazard_mode: none
teacher_source: ema
teacher_confidence_metric: margin
teacher_w_min: 0.5
teacher_w_max: 2.0
teacher_neutral_weight: 1.0
teacher_log_metrics: true
