# Shared CIFAR-10 training defaults.
seed: 0

num_train_steps: ${training.max_steps}
ema_rate: 0.9999

log_every_steps: 500
timing_warn_seconds: 30
eval_every_steps: 0
checkpoint_every_steps: 10000
log_images_every_steps: 10000
num_log_images: 16

checkpoint_dir: checkpoints
checkpoint_keep: 3
save_final_checkpoint: true
best_checkpoint_metric: eval/fid
best_checkpoint_mode: min
best_update_on_equal: false

metrics_dir: metrics
metrics_every_steps: 1000
save_final_metrics: true

sample_timesteps: ${..sampler.n_steps}

# Checkpoint-resume for fine-tuning: load params from a prior run.
init_from_checkpoint: null
init_load_ema: true
init_reset_optimizer: true
init_reset_step: true
init_checkpoint_step: null
