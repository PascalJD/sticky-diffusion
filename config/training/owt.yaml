defaults:
  - base
  - _self_

name: owt

# Text runs do not use image-grid logging.
log_images_every_steps: 0

# Prefer likelihood-based checkpoint selection for text.
best_checkpoint_metric: eval/loss
best_checkpoint_mode: min

# Optional periodic likelihood evaluation on the held-out token file.
likelihood_eval_every_steps: 10000
likelihood_eval_max_batches: 8
