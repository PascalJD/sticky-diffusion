# Training schedule for MD4 on CIFAR-10.
name: md4_cifar10

# Randomness.
seed: 0

# Optimization length and EMA.
num_train_steps: 2000000
ema_rate: 0.9999

# Logging/eval/checkpoint cadence.
log_every_steps: 500
eval_every_steps: 10000
checkpoint_every_steps: 5000
log_images_every_steps: 5000
num_log_images: 16  # must be a perfect square for nice grids

# Sampling budget for qualitative logging.
sample_timesteps: 256
