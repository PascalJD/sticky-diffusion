defaults:
  - base
  - _self_

name: sudoku_sjd

num_train_steps: ${training.max_steps}
# 300 epochs to match Train-for-the-Worst (Kim et al. 2025), Appendix D.2:
# 6M GPT-2-like backbone, batch=128, LR=1e-3, 300 epochs on the Shah Sudoku
# train split. The resolver in loop_helpers.derives num_train_steps from this
# at run time and overwrites cfg.training.num_train_steps so the LR cosine
# schedule sees the correct horizon. Set to 0 to fall back to max_steps.
num_train_epochs: 300
best_update_on_equal: true

log_every_steps: 500
timing_warn_seconds: 15
eval_every_steps: 10000
checkpoint_every_steps: 10000
checkpoint_keep: 5
log_images_every_steps: 0

best_checkpoint_metric: eval/predictor_only/solve_rate
best_checkpoint_mode: max

sample_timesteps: ${..sampler.n_steps}

log_state_dependency: true
state_dep_log_ratio_clip: ${..sampler.log_ratio_clip}

# Time sampling: "uniform" (default) or "antithetic"
time_sampling: uniform
# Loss weighting: "uniform" (default) or "alpha_deriv" (MDM importance weight)
loss_weighting: uniform
