# Sudoku training schedule for SJD.
name: sjd_sudoku

# Randomness.
seed: 0

# Optimization length and EMA.
# Shortened default horizon for faster iteration while tuning stability.
num_train_steps: 3500000
ema_rate: 0.9999

# Logging/eval/checkpoint cadence.
log_every_steps: 500
timing_warn_seconds: 15
eval_every_steps: 10000
checkpoint_every_steps: 10000
log_images_every_steps: 0
num_log_images: 16

# Artifact persistence.
checkpoint_dir: checkpoints
checkpoint_keep: 5
save_final_checkpoint: true
best_checkpoint_metric: eval/acc_complete_puzzle
best_checkpoint_mode: max

metrics_dir: metrics
metrics_every_steps: 1000
save_final_metrics: true

# Sampling budget for qualitative logging.
sample_timesteps: ${..sampler.n_steps}

# State-dependency diagnostics.
log_state_dependency: true
state_dep_log_ratio_clip: ${..sampler.log_ratio_clip}
