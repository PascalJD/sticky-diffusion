# Training schedule for SJD on CIFAR-10.
name: sjd_cifar10

# Randomness.
seed: 0

# Optimization length and EMA.
num_train_steps: 2000000
ema_rate: 0.9999

# Logging/eval/checkpoint cadence.
log_every_steps: 100
eval_every_steps: 5000
checkpoint_every_steps: 5000
log_images_every_steps: 2500
num_log_images: 16

# Sampling budget for qualitative logging.
sample_timesteps: ${..sampler.n_steps}
