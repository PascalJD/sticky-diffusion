# Paper-style CIFAR-10 training schedule for DDPM.
name: ddpm_cifar10_paper

seed: 0

num_train_steps: 400000
ema_rate: 0.9999

log_every_steps: 500
timing_warn_seconds: 30
eval_every_steps: 0
checkpoint_every_steps: 10000
log_images_every_steps: 10000
num_log_images: 16

checkpoint_dir: checkpoints
checkpoint_keep: 5
save_final_checkpoint: true
best_checkpoint_metric: eval/fid
best_checkpoint_mode: min

metrics_dir: metrics
metrics_every_steps: 1000
save_final_metrics: true

sample_timesteps: ${..model.timesteps}
