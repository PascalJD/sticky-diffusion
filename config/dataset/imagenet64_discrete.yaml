# Downsampled ImageNet 64x64 discrete-token dataset settings.
name: imagenet64_discrete
data_dir: data/tfds
tfds_name: sticky_imagenet64
train_split: train
eval_split: validation
include_label: false

# Global batch sizes (for single-device and pmap paths).
# SJD plug-in hazard computes batch x H x W x C x |anchors| x anchor_dim,
# which for anchor_dim=64 on 64x64x3 images needs ~400MB per batch item.
# On 2x H100 80GB, 64 global (32/device) fits comfortably; 128 OOMs.
batch_size: 64
eval_batch_size: 64
shuffle_buffer_size: 50000

# Optional per-device override used for parameter initialization.
per_device_batch_size: -1

# Token/image geometry.
data_shape: [64, 64, 3]
vocab_size: 256
num_classes: -1

# Pixel-preserving augmentation: random 90-degree rotations
# and horizontal flips, applied per training example with probability 15%.
augment:
  enabled: false
  prob: 0.15
  rotate: true
  hflip: true
  eval: false
