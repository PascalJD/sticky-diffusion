# Sudoku sequence dataset settings.
name: sudoku
data_dir: data/sudoku
train_file: Sudoku-train-data.npy
test_file: Sudoku-test-data.npy

# Global batch sizes (for single-device and pmap paths).
batch_size: 128
eval_batch_size: 128

# Optional per-device override used for parameter initialization.
per_device_batch_size: -1

# Token sequence geometry.
data_shape: [243]
vocab_size: 10
num_classes: -1

# Loader behavior.
# If SCRATCH is set and this remains the default relative path, data is
# automatically downloaded to $SCRATCH/sticky-diffusion/data/sudoku.
drop_remainder: true
shuffle: true
mmap: true
seq_order: dataset  # dataset | fixed | random
auto_download: true
download_timeout_sec: 120
download_retries: 8

# Optional truncation for debugging (-1 means use all examples).
max_train_examples: -1
max_test_examples: -1
