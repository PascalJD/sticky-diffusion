defaults:
  - /model/backbone@_here_: gpt2_like_sudoku_inpaint_6m
  - /model/anchor@anchor: thermometer
  - _self_

# Board-level SJD model for the Shah-board Sudoku policy ablation.
name: sjd

num_heads: 12
use_attn_dropout: true
mlp_type: gelu
depth_scaled_init: false
cond_type: adaln
time_features: t
model_sharding: false

anchor:
  family: thermometer
  dim: 64
  learnable: false
  seed: 0
  init_std: 1.0
  transform:
    scale: 1.0
    whiten: false
    center_columns: false
    equalize_row_norms: true
