defaults:
  - /model/backbone@_here_: gpt2_like_sudoku_inpaint_6m
  - /model/anchor@anchor: ordered_normal
  - _self_

# Board-level SJD model for the Shah-board Sudoku policy ablation.
name: sjd

num_heads: 12
use_attn_dropout: true
mlp_type: gelu
depth_scaled_init: false
cond_type: adaln
time_features: t
model_sharding: false

anchor:
  family: ordered_normal
  dim: 64
  learnable: true
  seed: 0
  init_std: 1.0
  order_weight: 1.0
  residual_weight: 1.0
