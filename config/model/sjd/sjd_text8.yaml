defaults:
  - /model/backbone@_here_: transformer_text8
  - /model/anchor@anchor: normal_normalized
  - _self_

# SJD model for Text8 (vocab=27, seq_len=128), CANDI "tiny" scale (~8M params).
# - Anchors are a CDCD-normalized Gaussian table over the 27 chars (learnable).
#   pretrained_gpt2 is impossible for a 27-char vocab.
# - Output classifier head is separate from the anchor table (untied), inherent
#   to SJD; matches CANDI tie_word_embeddings=false.
name: sjd

num_heads: 8
use_attn_dropout: true
mlp_type: swiglu
depth_scaled_init: false
cond_type: adaln_zero
time_features: t
model_sharding: false
use_noisy_input_bias: true
