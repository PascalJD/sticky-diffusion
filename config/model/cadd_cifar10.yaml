defaults:
  - architecture@_here_: adm_unet
  - cadd_latent: gaussian
  - _self_

# Canonical CADD model for CIFAR-10.
# Defaults to the Gaussian latent; flow matching remains available as an override.
name: cadd

cont_time: true
timesteps: 512
discrete_schedule_type: linear  # alpha(t)=1-t
schedule_eps: 0.0

use_attn_dropout: true

num_heads: 12
mlp_type: swiglu
depth_scaled_init: false
cond_type: adaln
model_sharding: false
time_features: t

# Conditioning.
classes: -1

# Sampling (Appendix B.2).
sampling_grid: cosine
temperature_schedule: cosine_decay
tau_max: 2.5
logit_temperature: 1.0

z0_estimator: hard
K: 1
force_decode_at_end: true

# Keep a lightweight single-step corrector available.
corrector_enabled: false
corrector_steps: 1
corrector_remask_frac: 0.1
corrector_metric: entropy
corrector_sample_mode: sample
