defaults:
  - cadd_latent: gaussian
  - _self_

# CADD model config for CIFAR-10.
name: cadd

# Core diffusion setup.
cont_time: true

# The paper reports image results with NFE=512.
timesteps: 512

# Forward-process schedules.
discrete_schedule_type: linear     # alpha(t)=1-t
# Continuous latent config lives under `model.cadd_latent.*` and defaults to the
# Gaussian latent from the main derivation.
# No clipping: alpha(t)=1-t and, with the default linear continuous schedule,
# gamma_bar(t)=1-t.
schedule_eps: 0.0

# Backbone / embedding.
# MDM-Prime Appendix A.4.2 uses embedding dimension 96 for image experiments.
feature_dim: 96
n_layers: 32
n_dit_layers: 0
dit_num_heads: 12
dit_hidden_size: 768

# Use the ADM-style UNet backbone (MDM-Prime / ADM).
image_backbone: adm_unet5d
sequence_backbone: auto

# ADM / MDM-Prime style knobs.
# MDM-Prime Appendix A.4.2 reports channel multipliers [3,4,4].
ch_mult: [3, 4, 4]
# Paper reports depth=5. In this implementation the decoder has (num_res_blocks + 1)
# residual blocks per level, so setting 4 best matches the reported ~114M-parameter scale.
adm_num_res_blocks: 4
adm_attention_resolutions: [2, 4]
adm_num_heads: 4
# MDM-Prime Appendix A.4.2: attention head channels = 64.
adm_num_head_channels: 64
adm_num_heads_upsample: -1
adm_conv_resample: true
adm_use_scale_shift_norm: true
adm_resblock_updown: false
adm_use_conv_skip: false
adm_use_new_attention_order: false

# Regularization.
dropout_rate: 0.1
use_attn_dropout: true

# Transformer-only fields (unused for the image UNet path).
num_heads: 12
mlp_type: swiglu
depth_scaled_init: false
cond_type: adaln
model_sharding: false
time_features: t

# Conditioning.
classes: -1

# Sampling (Appendix B.2).
sampling_grid: cosine
temperature_schedule: cosine_decay
tau_max: 2.5
logit_temperature: 1.0

z0_estimator: hard
K: 1
force_decode_at_end: true

# Sampling corrector (paper: "applied the corrector following Gat et al. (2024)").
# Keep a lightweight single-step corrector on by default.
corrector_enabled: true
corrector_steps: 1
corrector_remask_frac: 0.1
corrector_metric: entropy
corrector_sample_mode: sample
