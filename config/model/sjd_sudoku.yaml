defaults:
  - anchor: normal
  - _self_

# Canonical SJD model for Sudoku sequences.
name: sjd

# 6M GPT-2-like backbone used for the original Sudoku experiments.
feature_dim: 32
num_heads: 12
n_layers: 3
n_dit_layers: 0
dit_num_heads: 12
dit_hidden_size: 384

dropout_rate: 0.1
use_attn_dropout: true
mlp_type: swiglu
depth_scaled_init: false
cond_type: adaln
model_sharding: false

sequence_backbone: transformer
image_backbone: auto

# Image-only knobs are unused for sequence mode, but the shared model
# constructor still expects them.
ch_mult: [1]
adm_num_res_blocks: 2
adm_attention_resolutions: [2, 4]
adm_num_heads: 4
adm_num_head_channels: -1
adm_num_heads_upsample: -1
adm_conv_resample: true
adm_use_scale_shift_norm: true
adm_resblock_updown: false
adm_use_conv_skip: false
adm_use_new_attention_order: false

anchor:
  family: normal
  dim: 64
  learnable: false
  seed: 0
  init_std: 1.0
