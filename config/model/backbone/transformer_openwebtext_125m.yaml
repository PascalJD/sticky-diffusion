# LLAMA2-style Transformer backbone for OWT SJD.
# 12 layers x 768 hidden (feature_dim * num_heads = 64 * 12) ~= 125M params.
# Non-causal, RoPE, SwiGLU MLP, adaLN-zero time conditioning. Matches MDLM/MD4
# reference DiT depth/width (seq_len 1024, vocab 50257).
feature_dim: 64
n_layers: 12
n_dit_layers: 0
dit_num_heads: 12
dit_hidden_size: 768
dropout_rate: 0.1

sequence_backbone: transformer
sequence_mlp_hidden_dim: 3072
sequence_max_length: 1024
sequence_causal: false
image_backbone: auto

ch_mult: [1]
adm_num_res_blocks: 2
adm_attention_resolutions: [2, 4]
adm_num_heads: 4
adm_num_head_channels: -1
adm_num_heads_upsample: -1
adm_conv_resample: true
adm_use_scale_shift_norm: true
adm_resblock_updown: false
adm_use_conv_skip: false
adm_use_new_attention_order: false

use_attn_dropout: true
num_heads: 12
mlp_type: swiglu
depth_scaled_init: false
cond_type: adaln_zero
outside_embed: false
model_sharding: false
