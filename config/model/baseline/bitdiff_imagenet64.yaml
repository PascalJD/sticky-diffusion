# Bit Diffusion baseline for ImageNet64 via analog bits.
defaults:
  - /model/backbone@_here_: adm_unet_imagenet64
  - _self_

name: bitdiff

cont_time: true
timesteps: 512
num_bits: 8
encoding: uint8
predict_target: x0
loss_type: mse
self_conditioning: true
self_conditioning_rate: 0.5
analog_bit_scale: 1.0
clip_x0: true
signal_schedule_type: linear
schedule_eps: 0.0

time_features: t
classes: -1

# Bit Diffusion uses the shared ADM 5D image-token backbone.
image_backbone: adm_unet5d
