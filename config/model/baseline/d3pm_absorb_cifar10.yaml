defaults:
  - /model/backbone@_here_: adm_unet
  - _self_

name: d3pm
transition_type: absorb
transition_beta_schedule: absorbing_linear
timesteps: 256
auxiliary_loss_weight: 1.0e-3
# This absorb variant uses a fixed in-vocabulary CIFAR-10 token value rather
# than a dedicated extra token, so the shared discrete image head stays 256-way.
absorbing_state: 128

time_features: t
antithetic_time_sampling: true
num_heads: 12
use_attn_dropout: true
mlp_type: swiglu
depth_scaled_init: true
cond_type: adaln_zero
outside_embed: false
model_sharding: false

image_backbone: adm_unet5d
classes: -1
