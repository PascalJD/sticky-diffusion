# MD4 model config for CIFAR-10.
defaults:
  - /model/backbone@_here_: md4_unet
  - _self_

name: md4

# Core diffusion setup.
cont_time: true
timesteps: 256
noise_schedule_type: linear
time_features: t

# Conditioning.
classes: -1  # set to 11 if you want CIFAR10 + null class for CFG-style unconditional drop
antithetic_time_sampling: true
