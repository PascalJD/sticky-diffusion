defaults:
  - /model/backbone@_here_: adm_unet
  - /model/cadd_latent@cadd_latent: gaussian
  - _self_

# Canonical CADD model for CIFAR-10.
# Defaults to the Gaussian latent; flow matching remains available as an override.
name: cadd

cont_time: true
timesteps: 512
discrete_schedule_type: linear  # alpha(t)=1-t
schedule_eps: 0.0

use_attn_dropout: true

num_heads: 12
mlp_type: swiglu
depth_scaled_init: false
cond_type: adaln
model_sharding: false
time_features: t

# Conditioning.
classes: -1
