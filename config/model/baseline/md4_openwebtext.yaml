# MD4 model config for OpenWebText.
# Uses the 12x768 LLAMA2-style transformer backbone shared with SJD/MDLM for fair
# comparison. Matches Shi et al. (2024) md4/configs/md4/openwebtext.py hyperparameters.
defaults:
  - /model/backbone@_here_: transformer_openwebtext_125m
  - _self_

name: md4

cont_time: true
timesteps: 1000
noise_schedule_type: linear
time_features: t

classes: -1
antithetic_time_sampling: true
