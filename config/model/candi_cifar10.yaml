defaults:
  - architecture@_here_: adm_unet
  - _self_

# Experimental image-native CANDI adaptation for CIFAR-10 discrete pixels.
name: candi
experimental: true

cont_time: true
timesteps: 256
representation: embed

# Structured keep-mask process: alpha(t)=1-t.
alpha_schedule_type: linear
schedule_eps: 0.0

# Continuous corruption schedule for corrupted positions.
use_percentile_scheduling: true
min_percentile: 0.01
max_percentile: 0.45
sigma_min: 0.2
sigma_max: 4.0
ode_step_scale: 1.0

use_attn_dropout: true

num_heads: 12
mlp_type: swiglu
depth_scaled_init: false
cond_type: adaln
model_sharding: false
time_features: t

# Conditioning.
classes: -1
