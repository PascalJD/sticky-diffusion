defaults:
  - anchor: ordered_scalar
  - _self_

# Paper-style SJD model config for CIFAR-10.
name: sjd

# Anchor table. From the root training config, use `model/anchor@experiment.model.anchor=...`
# to swap preset families, or override `model.anchor.*` directly.

# Match the CADD/ADM image recipe for apples-to-apples CIFAR-10 comparison.
feature_dim: 96
num_heads: 12
n_layers: 32
n_dit_layers: 0
dit_num_heads: 12
dit_hidden_size: 768

# Keep the current CIFAR regularization defaults.
dropout_rate: 0.1
use_attn_dropout: true
mlp_type: swiglu
depth_scaled_init: true
cond_type: adaln_zero
outside_embed: false
time_features: t

# Backbone selection.
# sequence_backbone: auto | transformer | sharded_transformer
# image_backbone: auto | unet5d | adm_unet5d
sequence_backbone: auto
image_backbone: adm_unet5d

# Match the ADM image width/depth settings used by the paper-style CADD profile.
ch_mult: [3, 4, 4]
# The paper reports "depth 5". In this implementation the decoder has
# (adm_num_res_blocks + 1) residual blocks per level, so 4 is the closest
# parity to the reported scale.
adm_num_res_blocks: 4
adm_attention_resolutions: [2, 4]
adm_num_heads: 4
adm_num_head_channels: 64
adm_num_heads_upsample: -1
adm_conv_resample: true
adm_use_scale_shift_norm: true
adm_resblock_updown: false
adm_use_conv_skip: false
adm_use_new_attention_order: false

# Parallelization.
model_sharding: false
