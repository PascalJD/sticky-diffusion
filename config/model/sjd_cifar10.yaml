# config/model/sjd_cifar10.yaml

name: sjd

anchor_dim: 64
learnable_anchors: false
anchors_init_std: 1.0

feature_dim: 128
num_heads: 12
n_layers: 32
n_dit_layers: 0
dit_num_heads: 12
dit_hidden_size: 768
ch_mult: [1]

dropout_rate: 0.0
use_attn_dropout: true
mlp_type: swiglu
depth_scaled_init: false
cond_type: adaln
outside_embed: false
time_features: t

model_sharding: false
