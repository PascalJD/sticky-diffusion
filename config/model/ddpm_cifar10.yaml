# Continuous-state Gaussian DDPM model config for CIFAR-10.
defaults:
  - architecture@_here_: adm_unet
  - _self_

name: ddpm

# Classical DDPM setup.
timesteps: 1000
beta_schedule: linear
beta_start: 1.0e-4
beta_end: 2.0e-2
prediction_type: eps
variance_type: fixed_small
clip_x0: true

# Continuous DDPM uses the 2D ADM variant.
image_backbone: adm_unet2d

# Conditioning.
classes: -1
