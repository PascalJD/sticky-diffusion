# CADD-style CIFAR-10 evaluation setup.

# Global toggles.
enabled: true
prefix: eval
log_at_step_zero: false

# FID scheduling and sample counts.
fid_enabled: true
fid_every: 50000
fid_num_samples: 50000
fid_batch_size: 128

# Reference dataset and cache setup.
fid_dataset_name: cifar10
fid_split: train
fid_tfds_data_dir: null
fid_cache_dir: data/fid_stats

# Inception extraction.
fid_inception_batch_size: 128
fid_inception_device: null

# Inception Score scheduling and sample counts.
is_enabled: true
is_every: ${.fid_every}
is_num_samples: ${.fid_num_samples}
is_batch_size: ${.fid_batch_size}
is_splits: 10
is_inception_batch_size: ${.fid_inception_batch_size}
is_inception_device: ${.fid_inception_device}
