# Multi-sampler board-level Sudoku eval for the simple 81-cell inpainting
# benchmark.
mode: sudoku
enabled: true
prefix: eval
log_at_step_zero: false
run_at_end: true
verbose: false

sudoku_every: ${experiment.training.eval_every_steps}
sudoku_num_batches: 64
sudoku_num_batches_force: -1
sudoku_eval_seed_offset: 1776
sudoku_sample_seed_offset: 314159
sudoku_eval_fold_in_step: false
sudoku_progress_every_batches: 20
param_source: ema

sudoku_run_all_sampler_modes: true
sudoku_eval_samplers:
  vanilla:
    sampler: mdm_sudoku_inpaint_vanilla
    method: vanilla
  top_probability:
    sampler: mdm_sudoku_inpaint_top_probability
    method: top_probability
  top_prob_margin:
    sampler: mdm_sudoku_inpaint_top_prob_margin
    method: top_prob_margin
sudoku_primary_sampler_label: top_prob_margin
sudoku_num_batches_per_sampler: ${.sudoku_num_batches}
