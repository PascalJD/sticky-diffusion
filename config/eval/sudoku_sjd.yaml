# Canonical compact/default SJD Sudoku comparison.
mode: sudoku
enabled: true
prefix: eval
log_at_step_zero: false
run_at_end: true
verbose: false

sudoku_every: ${experiment.training.eval_every_steps}
sudoku_num_batches: 64
sudoku_num_batches_force: -1
sudoku_eval_seed_offset: 1776
sudoku_sample_seed_offset: 314159
sudoku_eval_fold_in_step: false
sudoku_progress_every_batches: 20
param_source: ema

sudoku_run_all_sampler_modes: true
sudoku_primary_sampler_label: predictor_only
sudoku_num_batches_per_sampler: ${.sudoku_num_batches}
sudoku_log_policy_table: true
sudoku_write_progress_csv: true
sudoku_progress_csv_path: metrics/sudoku_sjd_progress.csv
sudoku_write_latest_csv: true
sudoku_latest_csv_path: metrics/sudoku_sjd_latest.csv

sudoku_eval_sjd_runs:
  # Deterministic linear-survival policy — the paper's Table-1 baseline.
  linear_survival:
    kind: policy
    policy: linear_survival
    n_steps: 50
    sampling_grid: uniform
    eta: 1.00
  # Top-k probability policy — paper's Table-1 main result (96.43%).
  linear_topk_probability:
    kind: policy
    policy: linear_topk_probability
    n_steps: 50
    sampling_grid: uniform
    stochastic_k: false
    eta: 1.00
  # Reverse-time predictor only — anchors `best_checkpoint_metric`.
  predictor_only:
    kind: sampler
    sampler: sjd_sudoku
