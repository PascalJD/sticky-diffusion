# Sudoku evaluation setup.
mode: sudoku
enabled: true
prefix: eval
log_at_step_zero: false
run_at_end: true
verbose: false

# Periodic Sudoku evaluation during training.
sudoku_every: ${experiment.training.eval_every_steps}

# Number of test batches per scheduled eval.
# <= 0 means evaluate the full test split.
sudoku_num_batches: 64

# Number of test batches for forced eval calls (final/offline).
# <= 0 means evaluate the full test split.
sudoku_num_batches_force: -1

# Optional deterministic controls.
sudoku_eval_seed_offset: 1776
sudoku_sample_seed_offset: 314159
sudoku_eval_fold_in_step: false
sudoku_progress_every_batches: 20
