# AdamW for Text8 SJD. CANDI config_text8 recipe (NOT the OWT/MDLM recipe):
# lr 1e-3, weight_decay 0, b2 0.999, constant LR with NO warmup, grad clip 1.0.
# (b1=0.9 and eps=1e-8 are the optax adamw defaults used by make_optimizer.)
name: adamw
learning_rate: 1.0e-3
warmup_steps: 0
lr_schedule: warmup_constant   # warmup_steps=0 -> optax.constant_schedule
grad_clip_norm: 1.0
weight_decay: 0.0
b2: 0.999
