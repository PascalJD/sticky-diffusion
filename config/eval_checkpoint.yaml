# Root Hydra config for offline checkpoint evaluation.
defaults:
  - experiment: sudoku/sjd_sudoku
  - offline_eval: default
  - hydra: default
  - wandb: default
  - _self_
  - override eval: sudoku_sjd_report

wandb:
  enabled: false

hydra:
  job:
    name: eval_checkpoint

training:
  max_steps: 400000
