# Offline checkpoint-evaluation options.

# Checkpoint root selection:
# 1) If `checkpoint_dir` is set, use it directly as the checkpoint root.
# 2) Else if `run_dir` is set, read `<run_dir>/run_context.json` checkpoint_dir
#    when available, otherwise use `<run_dir>/<experiment.training.checkpoint_dir>`.
# 3) Else fall back to `experiment.training.checkpoint_dir` from this Hydra run.
checkpoint_dir: null
run_dir: null

# Which CheckpointWriter subdirectory to evaluate:
# - periodic/latest/root: periodic checkpoints directory itself
# - best: periodic_dir/best
# - final: periodic_dir/final
checkpoint_source: best

# Optional explicit checkpoint step (e.g., 50000). Null => latest in selected dir.
checkpoint_step: null

# Use EMA params when available.
use_ema: true

# Force a one-off metric pass regardless of schedule cadence.
# For non-FID evaluators (e.g. Sudoku), these flags still trigger evaluation.
force_fid: true
force_is: true

# Optional override for generator timesteps; null uses experiment.training.sample_timesteps.
sample_timesteps: null

# If true, rebuild model/task config from <run_dir>/run_context.json so offline
# eval reuses the exact training backbone / anchor / hazard / jump settings.
use_run_config: false

# Optional explicit eval-time SJD overrides applied after loading the run config.
# Leave null to preserve the training baseline.
jump_eta: null
logit_temperature: null

# Optional sampler probe diagnostics (primarily for SJD sweeps).
# Runs extra sampling batches and records mean sampler metrics in the report.
sampler_probe_batches: 0
sampler_probe_batch_size: null
sampler_probe_seed_offset: 777777

# Where to write the JSON report (relative to Hydra output dir unless absolute).
output_path: offline_eval_metrics.json
